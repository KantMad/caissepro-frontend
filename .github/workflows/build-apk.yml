name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet historique 'tools' n'existe plus dans les sdkmanager récents
          packages: 'platform-tools'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Clé de signature STABLE (secret) : indispensable pour que les MAJ s'installent
      # par-dessus. Sans elle, on échoue plutôt que de publier une APK à signature aléatoire.
      - name: Restaurer la clé de signature (stable)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret ANDROID_DEBUG_KEYSTORE_B64 absent"; exit 1; fi
          printf '%s' "$KS" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/tic.keystore"
          echo "TIC_KEYSTORE=$RUNNER_TEMP/tic.keystore" >> "$GITHUB_ENV"
          echo "Clé de signature restaurée."

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Vérifier la signature (garde-fou)
        env:
          EXPECTED: aad3a25b61b9df83a1ca00b61626b179a6b0fcccce600bbae2dbc2db93e237c7
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$($APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "Empreinte APK : $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then echo "::error::Signature inattendue ($GOT) — publication annulée"; exit 1; fi

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/TechInCash.apk

      # Publie l'APK sur le VPS → https://caisse.techincash.app/download/caissepro.apk
      - name: Publier sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Pas de secret VPS_SSH_KEY — publication VPS ignorée (APK dispo via GitHub Release)."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no \
            android/app/build/outputs/apk/debug/TechInCash.apk \
            ubuntu@51.77.149.138:/var/www/caissepro-apk/caissepro.apk
          echo "Publié sur https://caisse.techincash.app/download/caissepro.apk"

      - name: Delete previous latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (always)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tech in Cash - Derniere version
          files: android/app/build/outputs/apk/debug/TechInCash.apk
          body: |
            Derniere version de Tech in Cash APK.

            **Telecharger** : cliquez sur `TechInCash.apk` ci-dessous.

            Build: ${{ github.sha }}
            Date: ${{ github.event.head_commit.timestamp }}
          prerelease: false
          make_latest: true
